# HIP EP certified benchmark results — release_0.4.
#
# Imported from the internal ROCm HIP EP benchmark tracker, run date 2026-08-27.
# `previous` holds the release_0.3 numbers so the console and the docs can show the
# release-over-release delta without a second lookup.
#
# Metric definitions
#   ttft_s      seconds to the first generated token, at the given prompt length
#   tps         generated tokens per second in steady-state decode
#   rtf         real-time factor for speech: wall seconds per audio second, lower is better
#   first_ms    first-inference latency in milliseconds, includes graph compile and warmup
#   avg_ms      steady-state per-inference latency in milliseconds
#   qps         steady-state inferences per second
#
# Prompt lengths for ttft_s and tps are 128, 2048 and 16384 tokens.
# A null means the configuration was not run in that release, not that it failed.

