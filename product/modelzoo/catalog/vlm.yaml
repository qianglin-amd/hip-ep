#
# Certified vision-language models for HIP EP.
#
# Seeded from the internal ROCm HIP EP dashboard, release_0.4, run date 2026-08-27.
# All eight VLM entries passed that run.
#
# The VLM artifacts keep the vision encoder in fp16 and quantize only the text tower.
# That is deliberate: the encoder is a small fraction of the weights but dominates
# image quality, and quantizing it costs far more accuracy than it saves memory.
#
# Fields left null are genuinely unknown and must be filled from the upstream model
# card before the entry can be promoted past `preview`. Do not guess them.

tier: vlm
schema_version: 1

models:
  - id: gemma3-vl:4b
    name: Gemma 3 4B Instruct
    family: gemma3
    type: image-text-to-text
    base_model: google/gemma-3-4b-it
    license: gemma
    parameters: 4.3B
    description: >-
      The entry-point VLM: small enough for an 8 GB laptop GPU and still the fastest
      image-to-text model in the catalog. Start here when adding vision to an app.
    quantization:
      scheme: rtn
      weight_dtype: int4
      group_size: 128
      activation_dtype: fp16
      vision_encoder_dtype: fp16
      prune_logit: true
      chunk_size: 512
    context: { max: 131072, default: 32768 }
    capabilities: { vision: true, tools: false, thinking: false }
    vision: { max_image_pixels: 896x896, default_resize_height: 720 }
    footprint: { weights_gb: 3.2, min_vram_gb: 6 }
    artifact:
      dashboard_name: gemma3-4b-it-rtn-int4-128gs-fp16-onnx-gpu-pruned_lm_head
      format: oga-pipeline
      source: { kind: huggingface, repo: amd/gemma-3-4b-it-rtn-int4-onnx }
    recipe: gemma-vlm-rtn-int4.yaml
    certification: { release: release_0.4, run_date: 2026-08-27, status: pass }
    status: certified

