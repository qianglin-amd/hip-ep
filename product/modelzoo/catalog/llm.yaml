  - id: gpt-oss:120b
    name: gpt-oss 120B
    family: gpt-oss
    type: text-to-text
    base_model: openai/gpt-oss-120b
    license: apache-2.0
    parameters: 116.8B
    active_parameters: 5.1B
    description: >-
      The largest certified model. It only fits on a large unified-memory part such as
      Strix Halo, but because it is sparse it still decodes at interactive speed once
      resident.
    quantization:
      scheme: awq
      weight_dtype: uint4
      symmetry: asymmetric
      group_size: per-group
      activation_dtype: fp16
      layernorm_dtype: fp32
      prune_logit: true
      chunk_size: 512
    context: { max: 131072, default: 32768 }
    capabilities: { vision: false, tools: true, thinking: true }
    footprint: { weights_gb: 61.0, min_vram_gb: 72 }
    artifact:
      dashboard_name: gpt-oss-120b-w-uint4-pergroup-asym-awq-fp16-ssln-fp32-onnx-prune-lm-head
      format: oga-pipeline
      source: { kind: huggingface, repo: amd/gpt-oss-120b-uint4-awq-onnx }
    recipe: moe-awq-uint4-pergroup.yaml
    certification: { release: release_0.4, run_date: 2026-08-27, status: pass }
    status: certified

