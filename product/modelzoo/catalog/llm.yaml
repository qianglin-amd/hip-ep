  - id: gpt-oss:20b
    name: gpt-oss 20B
    family: gpt-oss
    type: text-to-text
    base_model: openai/gpt-oss-20b
    license: apache-2.0
    parameters: 20.9B
    active_parameters: 3.6B
    description: >-
      Sparse mixture-of-experts model. Only a fraction of the weights are active per
      token, so it decodes far faster than its parameter count suggests — the fastest
      TPS in the catalog.
    quantization:
      scheme: rtn
      weight_dtype: int4
      symmetry: symmetric
      group_size: 32
      activation_dtype: fp16
      prune_logit: true
      chunk_size: 512
    context: { max: 131072, default: 32768 }
    capabilities: { vision: false, tools: true, thinking: true }
