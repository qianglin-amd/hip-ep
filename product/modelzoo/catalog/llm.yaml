tier: llm
schema_version: 1

models:
  - id: llama3.1:8b
    name: Llama 3.1 8B Instruct
    family: llama3.1
    type: text-to-text
    base_model: meta-llama/Llama-3.1-8B-Instruct
    license: llama3.1
    parameters: 8.03B
    description: >-
      Meta's general-purpose 8B instruct model. The default recommendation for a first
      run on 16 GB and larger AMD GPUs: fast, well understood, and broadly compatible
      with existing OpenAI-style prompts.
    quantization:
      scheme: awq
      weight_dtype: int4
      symmetry: asymmetric
      group_size: 128
      activation_dtype: fp16
      prune_logit: true
      chunk_size: 512
    context: { max: 131072, default: 32768 }
    capabilities: { vision: false, tools: true, thinking: false }
    footprint: { weights_gb: 5.4, min_vram_gb: 8 }
    artifact:
      dashboard_name: Llama-3.1-8B-awq-g128-int4-asym-fp16-onnx-dml-pruned_lm_head
      format: oga-pipeline
      source: { kind: huggingface, repo: amd/Llama-3.1-8B-awq-g128-int4-asym-onnx }
    recipe: llama-awq-int4-asym.yaml
    certification: { release: release_0.4, run_date: 2026-08-27, status: pass }
    status: certified

