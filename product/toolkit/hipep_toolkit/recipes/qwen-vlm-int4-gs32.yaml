# Produces the certified qwen3.5-vl:9b and qwen3.6-vl:27b artifacts.

id: qwen-vlm-int4-gs32
name: Qwen VLM - INT4 group 32 text tower, fp16 vision encoder
recommended_for: dense Qwen3.x vision-language models
description: >-
  Group size 32 rather than 128, because document and chart understanding is the thing
  these models are chosen for and it is the first capability to degrade under coarse
  quantization. The vision encoder stays in fp16.

applies_to:
  families: [qwen3.5, qwen3.6, qwen3.8]
  architectures: [Qwen3VLForConditionalGeneration]
  produces: [qwen3.5-vl:9b, qwen3.6-vl:27b, qwen3.8-vl:27b]

quantization:
  tool: quark
  scheme: rtn
  weight_dtype: int4
  symmetry: symmetric
  group_size: 32
  activation_dtype: fp16
  vision_encoder_dtype: fp16
  kv_cache_dtype: fp16
  exclude: [lm_head, visual, merger]
  prune_logit: true
  chunk_size: 512

calibration: null

export:
  tool: quark
  target: onnx
  opset: 21
  external_data: true
  multimodal: true

build:
  tool: onnxruntime-genai
  pipeline: oga-pipeline
  execution_provider: hip
  processor: auto

validation:
  perplexity_regression_max_pct: 2.0
  smoke_prompts: 8
  smoke_images: 4
  require_gpu_execution: true
  compare_against: qwen3.5-vl:9b

notes: >-
  These models accept very large images. Resize on the client or set a resize height on
  the server: prefill cost grows with pixel count, and an unresized photo can dominate
  time to first token.
