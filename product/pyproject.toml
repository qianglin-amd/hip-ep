[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hipep-product"
version = "0.1.0"
description = "oga-server and the hipep toolkit: serving, model porting and benchmarking for HIP EP on AMD GPUs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AMD" }]
keywords = ["amd", "rocm", "onnxruntime", "llm", "vlm", "inference", "hip"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: GPU",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "psutil>=5.9",
    "PyYAML>=6.0",
    "Pillow>=10.0",
    "huggingface-hub>=0.24",
]

[project.optional-dependencies]
# The inference stack. Installed separately in practice because the wheels are
# platform- and GPU-architecture-specific; see product/docs/quickstart-*.md.
gpu = ["onnxruntime-genai", "onnxruntime"]
# Quantization via AMD Quark.
quant = ["amd-quark", "torch", "transformers", "datasets", "onnx"]
plan = ["python-pptx>=0.6.23"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
oga-server = "hipep_server.__main__:main"
hipep = "hipep_toolkit.__main__:main"

[project.urls]
Documentation = "https://github.com/ROCm/hip-ep/tree/main/product/docs"
Source = "https://github.com/ROCm/hip-ep"

[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
where = ["oga-server", "toolkit"]
include = ["hipep_server*", "hipep_toolkit*"]

[tool.setuptools.package-data]
hipep_server = ["web/**/*"]
hipep_toolkit = ["recipes/*.yaml", "templates/*"]

[tool.ruff]
line-length = 95
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["oga-server/tests", "toolkit/tests"]
asyncio_mode = "auto"
